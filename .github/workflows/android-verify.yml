name: Android verification

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check release consistency
        run: python3 scripts/check_release.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build debug APK and run unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Upload debug APK for review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xandyrs-turbo-rush-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

  refresh-store-art:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !contains(github.event.pull_request.title, '[skip art]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install poster renderer
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Render final game posters
        run: |
          sha256sum store/promo/poster2.html store/promo/render2.js store/promo/compose2.js app/src/main/assets/game/index.html > /tmp/art-sources.sha256
          if cmp -s /tmp/art-sources.sha256 store/promo/art-sources.sha256; then exit 0; fi
          node store/promo/render2.js app/src/main/assets/game
          node store/promo/compose2.js store
          cp /tmp/art-sources.sha256 store/promo/art-sources.sha256
      - name: Commit changed graphics to PR
        run: |
          git add store/screenshots store/feature-graphic.png store/promo/art-sources.sha256
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Regenerate no-trial Play screenshots'
          git push origin HEAD:${{ github.head_ref }}
